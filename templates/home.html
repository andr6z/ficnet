{% extends 'base.html' %}
{% load static %}

{% block title %}Planos de Internet - Ficnet{% endblock %}

{% block content %}
    
{% load static %}

<section class="hero-carousel">

    <div class="slide active">
        <img src="{% static 'assets/base.jpg' %}" alt="Ficnet - Internet de qualidade">
    </div>

    <div class="slide">
        <img src="{% static 'assets/internet.jpg' %}" alt="Conheça nossos serviços">
    </div>

    <div class="slide">
        <img src="{% static 'assets/internet2.jpg' %}" alt="Internet para sua família">
    </div>

    <div class="overlay">
        <div class="pag1">
            <h1>Bem-vindo à Ficnet!</h1>
            <h4>Conectamos você e sua família ao mundo digital em alta qualidade!</h4>
            <button class="verplanos">Ver Planos</button>
        </div>
    </div>

    <button class="seta anterior" aria-label="Imagem anterior">&#10094;</button>
    <button class="seta proxima" aria-label="Próxima imagem">&#10095;</button>

</section>

<script src="{% static 'js/carrossel.js' %}" defer></script>

{% endblock %}
